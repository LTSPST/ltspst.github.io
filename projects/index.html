<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Проекты — LTSPST</title>
  <style>
    :root {
      --bg: #120608; --card: #1e0b0e; --border: rgba(255, 80, 80, 0.14);
      --text: #f9f1f1; --muted: #c9a5a5; --accent1: #ff3b3b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text); line-height: 1.6; min-height: 100vh;
      position: relative; overflow-x: hidden;
    }

    /* ================= ФОН: БЕГАЮЩИЙ ПЕЧАТАЮЩИЙСЯ КОД ================= */
    .code-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      opacity: 0.6;
    }

    .code-line {
      position: absolute;
      white-space: nowrap;
      font-family: "SF Mono", "Consolas", "Courier New", monospace;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.3px;
      user-select: none;
      text-shadow: 0 0 10px currentColor;
      /* анимации: парение + покачивание */
      animation: codeFloat 8s ease-in-out infinite alternate,
                 codeWiggle 3s ease-in-out infinite alternate;
    }

    @keyframes codeFloat {
      from { transform: translateY(0); }
      to   { transform: translateY(-22px); }
    }
    @keyframes codeWiggle {
      from { transform: translateX(0) rotate(-0.5deg); }
      to   { transform: translateX(14px) rotate(0.7deg); }
    }

    /* Цвета кода — светлее фона */
    .code-line.white  { color: rgba(240, 240, 240, 0.4); }
    .code-line.orange { color: rgba(255, 150, 80, 0.45); }
    .code-line.dark   { color: rgba(0, 0, 0, 0.6); text-shadow: none; }
    .code-line.gray   { color: rgba(190, 190, 190, 0.3); }

    /* Бегущий курсор */
    .cursor {
      display: inline-block;
      width: 7px;
      height: 14px;
      background: currentColor;
      vertical-align: middle;
      margin-left: 2px;
      animation: blink 0.8s steps(1) infinite;
    }
    @keyframes blink {
      0%, 50%   { opacity: 1; }
      50.1%,100%{ opacity: 0; }
    }

    /* Мягкое затемнение */
    .code-overlay {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(255, 59, 59, 0.12), transparent 55%),
        linear-gradient(180deg, rgba(18, 6, 8, 0.35) 0%, rgba(18, 6, 8, 0.8) 65%, var(--bg) 100%);
    }

    /* ================= СНЕГ ================= */
    .snow {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }
    .snowflake {
      position: absolute;
      top: -10px;
      color: #fff;
      opacity: 0.85;
      animation-name: fall, drift;
      animation-timing-function: linear, ease-in-out;
      animation-iteration-count: infinite, infinite;
      animation-direction: normal, alternate;
      text-shadow: 0 0 6px rgba(255, 200, 200, 0.8);
    }
    @keyframes fall {
      from { transform: translateY(-10px); }
      to   { transform: translateY(105vh); }
    }
    @keyframes drift {
      from { margin-left: -30px; }
      to   { margin-left: 30px; }
    }

    /* Контент поверх */
    .header, .container { position: relative; z-index: 2; }

    .header {
      background: rgba(18, 6, 8, 0.85); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border); padding: 16px 24px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }

    .logo {
      font-weight: 900; font-size: 1.2rem; color: var(--text);
      display: flex; align-items: center; gap: 10px;
      text-decoration: none;
    }
    .logo img { width: 32px; height: 32px; border-radius: 8px; }

    .mobile-toggle {
      background: none;
      border: none;
      color: var(--text);
      font-size: 1.6rem;
      cursor: pointer;
      padding: 4px 10px;
      line-height: 1;
      border-radius: 8px;
      transition: background 0.2s;
    }
    .mobile-toggle:hover { background: rgba(255, 59, 59, 0.12); }

    .mobile-menu {
      display: none;
      flex-direction: column;
      background: var(--card);
      position: absolute;
      top: calc(100% + 8px);
      right: 16px;
      min-width: 180px;
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      animation: menuIn 0.18s ease;
      z-index: 101;
    }
    @keyframes menuIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .mobile-menu.active { display: flex; }
    .mobile-menu a {
      padding: 14px 18px;
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      border-bottom: 1px solid var(--border);
      transition: background 0.2s, color 0.2s;
    }
    .mobile-menu a:last-child { border-bottom: none; }
    .mobile-menu a:hover { background: #2a1114; color: #ff8a8a; }

    .container { max-width: 720px; margin: 0 auto; padding: 40px 18px; }
    h1 { font-size: 2rem; font-weight: 900; margin-bottom: 10px; color: var(--accent1); }
    .subtitle { color: var(--muted); margin-bottom: 24px; }

    .project-card {
      display: block; text-decoration: none; color: var(--text);
      background: linear-gradient(145deg, #220d10, #160709);
      border: 1px solid var(--border); border-radius: 20px;
      padding: 24px; margin-bottom: 16px; transition: transform 0.2s, border-color 0.2s;
    }
    .project-card:hover { transform: translateY(-3px); border-color: var(--accent1); }
    .project-tag {
      display: inline-block; font-size: 0.78rem; font-weight: 700;
      padding: 4px 10px; border-radius: 8px;
      background: rgba(255, 59, 59, 0.15); color: #ff8a8a; margin-bottom: 10px;
    }
    .project-card h2 { font-size: 1.4rem; margin-bottom: 8px; }
    .project-card p { color: var(--muted); font-size: 0.95rem; margin-bottom: 16px; }
    .project-link { color: #ff8a8a; font-weight: 700; font-size: 0.95rem; }
  </style>
</head>
<body>

  <!-- Фон: живой код -->
  <div class="code-bg" id="codeBg" aria-hidden="true"></div>
  <div class="code-overlay" aria-hidden="true"></div>

  <!-- Снег -->
  <div class="snow" id="snow" aria-hidden="true"></div>

  <header class="header">
    <a href="../" class="logo">
      <img src="../logo.png" alt="Логотип LTSPST" onerror="this.style.display='none'">
      LTSPST
    </a>

    <button class="mobile-toggle" aria-label="Открыть меню" id="burgerBtn">⋮</button>

    <div class="mobile-menu" id="mobileMenu">
      <a href="../">Главная</a>
      <a href="../news/">Новости</a>
      <a href="../#server">Сервер</a>
    </div>
  </header>

  <div class="container">
    <h1>Мои проекты</h1>
    <p class="subtitle">Здесь собраны все мои разработки</p>

    <a href="../LTSPST-Internet-Browser/" class="project-card">
      <div class="project-tag">🔥 Главный проект • Android</div>
      <h2>LTSPST Internet Browser</h2>
      <p>Приватный мобильный браузер на движке Firefox (GeckoView) без слежки и рекламы. Разработан полностью на смартфоне.</p>
      <div class="project-link">Открыть страницу →</div>
    </a>

    <!-- Сюда потом добавляй новые проекты -->
  </div>

  <script>
    // ===== МЕНЮ ТРИ ТОЧКИ =====
    const burgerBtn = document.getElementById('burgerBtn');
    const mobileMenu = document.getElementById('mobileMenu');

    burgerBtn.addEventListener('click', () => {
      mobileMenu.classList.toggle('active');
      burgerBtn.textContent = mobileMenu.classList.contains('active') ? '✕' : '⋮';
    });

    document.querySelectorAll('#mobileMenu a').forEach(link => {
      link.addEventListener('click', () => {
        mobileMenu.classList.remove('active');
        burgerBtn.textContent = '⋮';
      });
    });

    document.addEventListener('click', (e) => {
      if (!mobileMenu.contains(e.target) && e.target !== burgerBtn) {
        mobileMenu.classList.remove('active');
        burgerBtn.textContent = '⋮';
      }
    });

    // ===== ЖИВОЙ ПЕЧАТАЮЩИЙСЯ КОД =====
    (function createLiveCode() {
      const container = document.getElementById('codeBg');

      // Набор строк «кода», которые будут печататься
      const codeSnippets = [
        'const browser = new LTSPSTBrowser();',
        'function geckoView() { return "Firefox"; }',
        'app.listen(3000, () => console.log("ok"));',
        'if (user.privacy) { return "secure"; }',
        'import { Android } from "./mobile";',
        'let projects = ["browser", "site"];',
        'async function deploy() { await build(); }',
        'return <Project name="LTSPST" />;',
        'for (let i = 0; i < code.length; i++) {}',
        'class LTSPST extends Developer {}',
        'npm install geckoview --save',
        'export default function App() {}',
        'git commit -m "new feature"',
        'console.log("Hello, LTSPST!");',
        'while (true) { createSomething(); }',
        'def build_apk(): return "success"'
      ];

      const colors = ['white', 'orange', 'dark', 'gray'];

      // Создаём «печатные машинки» — каждая в своей точке
      const lineCount = 12; // сколько строк одновременно

      for (let i = 0; i < lineCount; i++) {
        const line = document.createElement('div');
        line.className = 'code-line ' + colors[Math.floor(Math.random() * colors.length)];

        // Позиция
        const top = Math.random() * 95;
        const left = Math.random() * 85;
        line.style.top = top + 'vh';
        line.style.left = left + 'vw';
        line.style.fontSize = (Math.random() * 5 + 11) + 'px';

        // Анимации с разными задержками
        line.style.animationDuration = (Math.random() * 6 + 5) + 's, ' + (Math.random() * 3 + 2) + 's';
        line.style.animationDelay = (-Math.random() * 10) + 's, ' + (-Math.random() * 5) + 's';

        // Текст + курсор
        const textSpan = document.createElement('span');
        const cursor = document.createElement('span');
        cursor.className = 'cursor';

        line.appendChild(textSpan);
        line.appendChild(cursor);
        container.appendChild(line);

        // Запускаем печать случайной строки
        typeLine(textSpan, codeSnippets, cursor);
      }

      // Функция «печати» строки с задержкой
      function typeLine(el, snippets, cursor) {
        const snippet = snippets[Math.floor(Math.random() * snippets.length)];
        let idx = 0;
        let isDeleting = false;

        function tick() {
          if (!isDeleting) {
            // Печатаем
            el.textContent = snippet.slice(0, idx + 1);
            idx++;
            if (idx >= snippet.length) {
              // Напечатали — пауза и начинаем стирать
              isDeleting = true;
              setTimeout(tick, 1500 + Math.random() * 1500);
              return;
            }
            setTimeout(tick, 60 + Math.random() * 80);
          } else {
            // Стираем
            el.textContent = snippet.slice(0, idx - 1);
            idx--;
            if (idx <= 0) {
              // Стерли — берём новую строку
              isDeleting = false;
              const newSnippet = snippets[Math.floor(Math.random() * snippets.length)];
              // Перезаписываем локальную переменную через замыкание
              el.textContent = '';
              typeLine(el, snippets, cursor);
              return;
            }
            setTimeout(tick, 25 + Math.random() * 30);
          }
        }
        tick();
      }
    })();

    // ===== СНЕГ =====
    (function createSnow() {
      const snowContainer = document.getElementById('snow');
      const flakeCount = 60;

      for (let i = 0; i < flakeCount; i++) {
        const flake = document.createElement('span');
        flake.className = 'snowflake';
        flake.textContent = Math.random() > 0.5 ? '❄' : '•';

        const size = Math.random() * 10 + 6;
        const left = Math.random() * 100;
        const fallDuration = Math.random() * 8 + 6;
        const driftDuration = Math.random() * 3 + 2;
        const delay = Math.random() * -20;

        flake.style.left = left + 'vw';
        flake.style.fontSize = size + 'px';
        flake.style.opacity = (Math.random() * 0.5 + 0.4).toFixed(2);
        flake.style.animationDuration = fallDuration + 's, ' + driftDuration + 's';
        flake.style.animationDelay = delay + 's, ' + delay + 's';

        snowContainer.appendChild(flake);
      }
    })();
  </script>
</body>
</html>
