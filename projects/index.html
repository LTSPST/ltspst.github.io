<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Проекты — LTSPST</title>
  <style>
    :root {
      --bg: #120608; --card: #1e0b0e; --border: rgba(255, 80, 80, 0.14);
      --text: #f9f1f1; --muted: #c9a5a5; --accent1: #ff3b3b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(ellipse at 50% 0%, rgba(255, 59, 59, 0.12), transparent 55%), var(--bg);
      color: var(--text); line-height: 1.6; min-height: 100vh;
    }
    .header {
      background: rgba(18, 6, 8, 0.85); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border); padding: 16px 24px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    .header a { color: var(--muted); text-decoration: none; font-weight: 600; transition: color 0.2s; }
    .header a:hover { color: var(--text); }
    .logo { font-weight: 900; font-size: 1.2rem; color: var(--text) !important; display: flex; align-items: center; gap: 10px; }
    .logo img { width: 32px; height: 32px; border-radius: 8px; }
    
    .container { max-width: 720px; margin: 0 auto; padding: 40px 18px; }
    h1 { font-size: 2rem; font-weight: 900; margin-bottom: 10px; color: var(--accent1); }
    .subtitle { color: var(--muted); margin-bottom: 24px; }
    
    .project-card {
      display: block; text-decoration: none; color: var(--text);
      background: linear-gradient(145deg, #220d10, #160709);
      border: 1px solid var(--border); border-radius: 20px;
      padding: 24px; margin-bottom: 16px; transition: transform 0.2s, border-color 0.2s;
    }
    .project-card:hover { transform: translateY(-3px); border-color: var(--accent1); }
    .project-tag {
      display: inline-block; font-size: 0.78rem; font-weight: 700;
      padding: 4px 10px; border-radius: 8px;
      background: rgba(255, 59, 59, 0.15); color: #ff8a8a; margin-bottom: 10px;
    }
    .project-card h2 { font-size: 1.4rem; margin-bottom: 8px; }
    .project-card p { color: var(--muted); font-size: 0.95rem; margin-bottom: 16px; }
    .project-link { color: #ff8a8a; font-weight: 700; font-size: 0.95rem; }
  </style>
</head>
<body>
  <header class="header">
    <a href="../" class="logo"><img src="../logo.png" onerror="this.style.display='none'"> ← LTSPST</a>
    <a href="../">На главную</a>
  </header>

  <div class="container">
    <h1>Мои проекты</h1>
    <p class="subtitle">Здесь собраны все мои разработки</p>

    <!-- ПЕРВЫЙ ПРОЕКТ (Браузер) -->
    <a href="../LTSPST-Internet-Browser/" class="project-card">
      <div class="project-tag">🔥 Главный проект • Android</div>
      <h2>LTSPST Internet Browser</h2>
      <p>Приватный мобильный браузер на движке Firefox (GeckoView) без слежки и рекламы. Разработан полностью на смартфоне.</p>
      <div class="project-link">Открыть страницу →</div>
    </a>

    <!-- Сюда потом можешь добавлять новые проекты по такому же шаблону:
    <a href="ссылка_на_проект" class="project-card">
      <div class="project-tag">Тег (например, Игра • Web)</div>
      <h2>Название проекта</h2>
      <p>Описание проекта в двух-трех предложениях.</p>
      <div class="project-link">Открыть →</div>
    </a>
    -->

  </div>
</body>
</html>
