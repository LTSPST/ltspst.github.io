<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Новости — LTSPST</title>
  <style>
    :root {
      --bg: #120608; --card: #1e0b0e; --border: rgba(255, 80, 80, 0.14);
      --text: #f9f1f1; --muted: #c9a5a5; --accent1: #ff3b3b; --accent2: #ff6b4a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(ellipse at 50% 0%, rgba(255, 59, 59, 0.18), transparent 60%), var(--bg);
      color: var(--text); line-height: 1.6; min-height: 100vh;
      position: relative; overflow-x: hidden;
    }

    /* ================= ФОН С НОВОСТНЫМИ ИКОНКАМИ ================= */
    .bg-icons {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .bg-icon {
      position: absolute;
      color: rgba(255, 140, 140, 0.22);
      animation: floatIcon 20s ease-in-out infinite alternate;
      user-select: none;
      line-height: 1;
    }
    @keyframes floatIcon {
      from { transform: translateY(0) rotate(-6deg) scale(1); }
      to   { transform: translateY(-30px) rotate(6deg) scale(1.08); }
    }
    /* Иконки чуть светлее на красном фоне */
    .bg-icon.light { color: rgba(255, 190, 190, 0.28); }
    .bg-icon.warm  { color: rgba(255, 150, 120, 0.24); }

    /* Мягкое затемнение для читаемости */
    .bg-overlay {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(255, 59, 59, 0.10), transparent 55%),
        linear-gradient(180deg, rgba(18, 6, 8, 0.35) 0%, rgba(18, 6, 8, 0.75) 60%, var(--bg) 100%);
    }

    /* ================= СНЕГ ================= */
    .snow {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }
    .snowflake {
      position: absolute;
      top: -10px;
      color: #fff;
      opacity: 0.85;
      animation-name: fall, drift;
      animation-timing-function: linear, ease-in-out;
      animation-iteration-count: infinite, infinite;
      animation-direction: normal, alternate;
      text-shadow: 0 0 6px rgba(255, 200, 200, 0.8);
    }
    @keyframes fall {
      from { transform: translateY(-10px); }
      to   { transform: translateY(105vh); }
    }
    @keyframes drift {
      from { margin-left: -30px; }
      to   { margin-left: 30px; }
    }

    /* Контент поверх фона и снега */
    .header, .container { position: relative; z-index: 2; }

    .header {
      background: rgba(18, 6, 8, 0.85); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border); padding: 16px 24px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }

    .logo {
      font-weight: 900; font-size: 1.2rem; color: var(--text);
      display: flex; align-items: center; gap: 10px;
      text-decoration: none;
    }
    .logo img { width: 32px; height: 32px; border-radius: 8px; }

    .mobile-toggle {
      background: none;
      border: none;
      color: var(--text);
      font-size: 1.6rem;
      cursor: pointer;
      padding: 4px 10px;
      line-height: 1;
      border-radius: 8px;
      transition: background 0.2s;
    }
    .mobile-toggle:hover { background: rgba(255, 59, 59, 0.12); }

    .mobile-menu {
      display: none;
      flex-direction: column;
      background: var(--card);
      position: absolute;
      top: calc(100% + 8px);
      right: 16px;
      min-width: 180px;
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      animation: menuIn 0.18s ease;
      z-index: 101;
    }
    @keyframes menuIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .mobile-menu.active { display: flex; }
    .mobile-menu a {
      padding: 14px 18px;
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      border-bottom: 1px solid var(--border);
      transition: background 0.2s, color 0.2s;
    }
    .mobile-menu a:last-child { border-bottom: none; }
    .mobile-menu a:hover { background: var(--card-hover, #2a1114); color: #ff8a8a; }

    .container { max-width: 720px; margin: 0 auto; padding: 40px 18px; }
    h1 { font-size: 2rem; font-weight: 900; margin-bottom: 10px; color: var(--accent1); }
    .subtitle { color: var(--muted); margin-bottom: 24px; }

    .auth-box {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 20px; margin-bottom: 24px;
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;
    }
    .auth-input {
      background: rgba(0,0,0,0.3); border: 1px solid var(--border); color: white;
      padding: 10px 14px; border-radius: 8px; outline: none; font-family: inherit;
    }
    .auth-input:focus { border-color: var(--accent1); }
    .btn {
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      color: white; border: none; padding: 10px 20px; border-radius: 8px;
      font-weight: 700; cursor: pointer; transition: transform 0.2s; font-family: inherit;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn-outline { background: transparent; border: 1px solid var(--accent1); color: var(--accent1); }
    .btn-outline:hover { background: rgba(255, 59, 59, 0.1); }
    .user-greet { display: flex; align-items: center; gap: 15px; width: 100%; justify-content: space-between; }

    .news-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 24px; margin-bottom: 16px; transition: transform 0.2s, border-color 0.2s;
      position: relative;
    }
    .news-card:hover { border-color: rgba(255, 59, 59, 0.4); }
    .date { font-size: 0.85rem; color: var(--muted); margin-bottom: 8px; font-weight: 600; }
    .news-card h2 { font-size: 1.3rem; margin-bottom: 10px; color: var(--text); }

    .news-content { color: var(--muted); font-size: 0.95rem; margin-bottom: 16px; line-height: 1.7; }
    .news-content p { margin-bottom: 10px; }
    .news-content strong { color: var(--text); font-weight: bold; }
    .news-content em { font-style: italic; }
    .news-content u { text-decoration: underline; }
    .news-content img { max-width: 100%; border-radius: 8px; margin: 10px 0; display: block; }
    .news-content a { color: var(--accent2); text-decoration: underline; }
    .news-content ul { padding-left: 20px; margin-bottom: 10px; }
    .news-content li { margin-bottom: 5px; }

    .comments-section { border-top: 1px solid var(--border); padding-top: 16px; margin-top: 16px; }
    .comment { background: rgba(0,0,0,0.2); padding: 12px; border-radius: 10px; margin-bottom: 10px; font-size: 0.9rem; }
    .comment-author { font-weight: bold; color: var(--accent2); margin-bottom: 4px; display: block; }
    .comment-form { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
    .comment-input {
      background: rgba(0,0,0,0.3); border: 1px solid var(--border);
      color: white; padding: 8px 12px; border-radius: 8px; outline: none; font-family: inherit; font-size: 0.9rem;
    }
    .comment-input:focus { border-color: var(--accent1); }
    .name-input { width: 120px; }
    .text-input { flex: 1; min-width: 150px; }

    .add-news-form { display: none; background: var(--card); border: 1px solid var(--accent1); border-radius: 16px; padding: 20px; margin-bottom: 24px; }
    .add-news-form.active { display: block; }
    .add-news-form input, .add-news-form textarea {
      width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border);
      color: white; padding: 10px; border-radius: 8px; margin-bottom: 10px; font-family: inherit; outline: none;
    }
    .add-news-form input:focus, .add-news-form textarea:focus { border-color: var(--accent1); }
    .add-news-form textarea { min-height: 150px; resize: vertical; }
    .hint { font-size: 0.8rem; color: var(--muted); margin-bottom: 15px; line-height: 1.4; }
    .hint code { background: rgba(255, 59, 59, 0.15); padding: 2px 4px; border-radius: 4px; font-family: monospace; }

    .delete-btn {
      position: absolute; top: 20px; right: 20px;
      background: rgba(255, 59, 59, 0.1); border: 1px solid rgba(255, 59, 59, 0.3);
      color: #ff8a8a; width: 32px; height: 32px; border-radius: 8px;
      display: grid; place-items: center; cursor: pointer; transition: all 0.2s;
      font-size: 1.1rem; z-index: 10;
    }
    .delete-btn:hover { background: rgba(255, 59, 59, 0.3); color: white; }
  </style>
</head>
<body>

  <!-- Фон: новостные иконки на красном -->
  <div class="bg-icons" id="bgIcons" aria-hidden="true"></div>
  <div class="bg-overlay" aria-hidden="true"></div>

  <!-- Снег -->
  <div class="snow" id="snow" aria-hidden="true"></div>

  <header class="header">
    <a href="../" class="logo">
      <img src="../logo.png" alt="Логотип LTSPST" onerror="this.style.display='none'">
      LTSPST
    </a>

    <button class="mobile-toggle" aria-label="Открыть меню" id="burgerBtn">⋮</button>

    <div class="mobile-menu" id="mobileMenu">
      <a href="../">Главная</a>
      <a href="https://ltspst.github.io/projects">Проекты</a>
      <a href="../server">Сервер</a>
    </div>
  </header>

  <div class="container">
    <div style="display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 10px;">
      <div>
        <h1>Новости</h1>
        <p class="subtitle">Последние события проекта</p>
      </div>
      <button id="toggleAddBtn" class="btn" style="display: none;" onclick="toggleAddForm()">+ Добавить новость</button>
    </div>

    <div id="authBox" class="auth-box">
      <div id="loginForm" style="display: flex; gap: 10px; flex-wrap: wrap; width: 100%;">
        <input type="text" id="loginInput" class="auth-input" placeholder="Логин (admin или friend)" style="flex: 1; min-width: 120px;">
        <input type="password" id="passInput" class="auth-input" placeholder="Пароль" style="flex: 1; min-width: 120px;">
        <button class="btn" onclick="loginUser()">Войти</button>
      </div>
      <div id="loggedInView" class="user-greet" style="display: none;">
        <span>Вы вошли как <b id="userRoleDisplay" style="color: var(--accent1);"></b></span>
        <button class="btn btn-outline" onclick="logoutUser()">Выйти</button>
      </div>
    </div>

    <div id="addNewsForm" class="add-news-form">
      <h3 style="margin-bottom: 15px;">Новая запись</h3>
      <div class="hint">
        Поддерживается Markdown:<br>
        <code>**жирный**</code>, <code>*курсив*</code>, <code>__подчеркнутый__</code><br>
        <code>![Описание](ссылка_на_картинку)</code> — для фото<br>
        <code>- пункт списка</code> — для списков
      </div>
      <input type="text" id="newsTitle" placeholder="Заголовок новости...">
      <textarea id="newsText" placeholder="Текст новости..."></textarea>
      <div style="display: flex; gap: 10px;">
        <button class="btn" onclick="addNews()">Опубликовать</button>
        <button class="btn btn-outline" onclick="toggleAddForm()">Отмена</button>
      </div>
    </div>

    <div id="newsList">
      <div class="loading-text">Загрузка новостей...</div>
    </div>
  </div>

  <script>
    // ===== МЕНЮ ТРИ ТОЧКИ =====
    const burgerBtn = document.getElementById('burgerBtn');
    const mobileMenu = document.getElementById('mobileMenu');

    burgerBtn.addEventListener('click', () => {
      mobileMenu.classList.toggle('active');
      burgerBtn.textContent = mobileMenu.classList.contains('active') ? '✕' : '⋮';
    });

    document.querySelectorAll('#mobileMenu a').forEach(link => {
      link.addEventListener('click', () => {
        mobileMenu.classList.remove('active');
        burgerBtn.textContent = '⋮';
      });
    });

    document.addEventListener('click', (e) => {
      if (!mobileMenu.contains(e.target) && e.target !== burgerBtn) {
        mobileMenu.classList.remove('active');
        burgerBtn.textContent = '⋮';
      }
    });

    // ===== ФОН: НОВОСТНЫЕ ИКОНКИ =====
    (function createBgIcons() {
      const container = document.getElementById('bgIcons');
      // Светлые «новостные» иконки
      const icons = ['📰', '📷', '🎙️', '🌐', '🔔', '📡', '🗞️', '📺', '📻', '💬', '🔍', '📢'];
      const count = 26;

      for (let i = 0; i < count; i++) {
        const icon = document.createElement('span');
        icon.className = 'bg-icon ' + (Math.random() > 0.5 ? 'light' : 'warm');
        icon.textContent = icons[Math.floor(Math.random() * icons.length)];

        const size = Math.random() * 70 + 28;          // 28–98px
        const top = Math.random() * 100;                // %
        const left = Math.random() * 100;               // %
        const dur = Math.random() * 12 + 12;            // 12–24s
        const delay = Math.random() * -20;

        icon.style.fontSize = size + 'px';
        icon.style.top = top + 'vh';
        icon.style.left = left + 'vw';
        icon.style.animationDuration = dur + 's';
        icon.style.animationDelay = delay + 's';
        // Индивидуальный сдвиг фазы, чтобы не двигались синхронно
        icon.style.animationDirection = Math.random() > 0.5 ? 'alternate' : 'alternate-reverse';

        container.appendChild(icon);
      }
    })();

    // ===== СНЕГ =====
    (function createSnow() {
      const snowContainer = document.getElementById('snow');
      const flakeCount = 60;

      for (let i = 0; i < flakeCount; i++) {
        const flake = document.createElement('span');
        flake.className = 'snowflake';
        flake.textContent = Math.random() > 0.5 ? '❄' : '•';

        const size = Math.random() * 10 + 6;
        const left = Math.random() * 100;
        const fallDuration = Math.random() * 8 + 6;
        const driftDuration = Math.random() * 3 + 2;
        const delay = Math.random() * -20;

        flake.style.left = left + 'vw';
        flake.style.fontSize = size + 'px';
        flake.style.opacity = (Math.random() * 0.5 + 0.4).toFixed(2);
        flake.style.animationDuration = fallDuration + 's, ' + driftDuration + 's';
        flake.style.animationDelay = delay + 's, ' + delay + 's';

        snowContainer.appendChild(flake);
      }
    })();
  </script>

  <!-- FIREBASE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, updateDoc, doc, arrayUnion, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAWpB5hZ6oDm89NxIR7d-yPZ2ST3efz8us",
      authDomain: "ltspst-site.firebaseapp.com",
      projectId: "ltspst-site",
      storageBucket: "ltspst-site.firebasestorage.app",
      messagingSenderId: "497361846340",
      appId: "1:497361846340:web:134d1b3737c9a800ce3c11",
      measurementId: "G-5N2W3HQS20"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const newsCollection = collection(db, "news");

    const ADMIN_LOGIN = "Stepan20098728";
    const ADMIN_PASSWORD = "gardosha2009";
    const FRIEND_LOGIN = "FRIENDS";
    const FRIEND_PASSWORD = "garda0927";

    let currentRole = localStorage.getItem('ltspst_role') || null;

    function parseMarkdown(text) {
      if (!text) return '';
      let html = text;
      html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1">');
      html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
      html = html.replace(/__(.*?)__/g, '<u>$1</u>');
      html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
      html = html.replace(/^\s*[-*]\s+(.*)$/gm, '<li>$1</li>');
      html = html.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');
      html = html.split(/\n{2,}/).map(para => {
        if (para.trim().startsWith('<ul>') || para.trim().startsWith('<img')) return para;
        return `<p>${para.replace(/\n/g, '<br>')}</p>`;
      }).join('');
      return html;
    }

    function updateAuthUI() {
      const loginForm = document.getElementById('loginForm');
      const loggedInView = document.getElementById('loggedInView');
      const toggleAddBtn = document.getElementById('toggleAddBtn');
      const roleDisplay = document.getElementById('userRoleDisplay');

      if (currentRole) {
        loginForm.style.display = 'none';
        loggedInView.style.display = 'flex';
        toggleAddBtn.style.display = 'block';
        roleDisplay.textContent = currentRole === 'admin' ? 'Админ' : 'Редактор';
      } else {
        loginForm.style.display = 'flex';
        loggedInView.style.display = 'none';
        toggleAddBtn.style.display = 'none';
        document.getElementById('addNewsForm').classList.remove('active');
      }
    }

    window.loginUser = () => {
      const login = document.getElementById('loginInput').value.trim();
      const pass = document.getElementById('passInput').value;

      if (login === ADMIN_LOGIN && pass === ADMIN_PASSWORD) {
        currentRole = 'admin';
      } else if (login === FRIEND_LOGIN && pass === FRIEND_PASSWORD) {
        currentRole = 'friend';
      } else {
        return alert('Неверный логин или пароль!');
      }

      localStorage.setItem('ltspst_role', currentRole);
      document.getElementById('loginInput').value = '';
      document.getElementById('passInput').value = '';
      updateAuthUI();
    };

    window.logoutUser = () => {
      currentRole = null;
      localStorage.removeItem('ltspst_role');
      updateAuthUI();
    };

    window.toggleAddForm = () => {
      document.getElementById('addNewsForm').classList.toggle('active');
    };

    window.addNews = async () => {
      if (!currentRole) return alert('Войдите, чтобы добавлять новости!');

      const title = document.getElementById('newsTitle').value.trim();
      const text = document.getElementById('newsText').value.trim();
      if (!title || !text) return alert('Заполни заголовок и текст!');

      try {
        await addDoc(newsCollection, {
          title: title,
          text: text,
          author: currentRole === 'admin' ? 'Админ' : 'Редактор',
          date: new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' }),
          createdAt: Date.now(),
          comments: []
        });

        document.getElementById('newsTitle').value = '';
        document.getElementById('newsText').value = '';
        toggleAddForm();
      } catch (e) {
        console.error("Ошибка добавления: ", e);
        alert("Ошибка при добавлении. Проверь базу данных!");
      }
    };

    window.deleteNews = async (id) => {
      if (currentRole !== 'admin') return alert('Только Админ может удалять новости!');
      if (!confirm('Точно удалить эту новость?')) return;

      try {
        await deleteDoc(doc(db, "news", id));
      } catch (e) {
        console.error("Ошибка удаления: ", e);
        alert("Не удалось удалить новость.");
      }
    };

    window.addComment = async (newsId) => {
      const nameInput = document.getElementById(`name_${newsId}`);
      const textInput = document.getElementById(`text_${newsId}`);

      const name = nameInput.value.trim() || 'Гость';
      const text = textInput.value.trim();

      if (!text) return alert('Напиши комментарий!');

      try {
        const newsDocRef = doc(db, "news", newsId);
        await updateDoc(newsDocRef, {
          comments: arrayUnion({ author: name, text: text, date: Date.now() })
        });
        nameInput.value = '';
        textInput.value = '';
      } catch (e) {
        console.error("Ошибка комментария: ", e);
        alert("Не удалось отправить комментарий.");
      }
    };

    function renderNewsList(snapshot) {
      const container = document.getElementById('newsList');
      container.innerHTML = '';

      if (snapshot.empty) {
        container.innerHTML = '<p style="color: var(--muted);">Пока новостей нет.</p>';
        return;
      }

      const newsArray = [];
      snapshot.forEach((doc) => {
        newsArray.push({ id: doc.id, ...doc.data() });
      });

      newsArray.sort((a, b) => b.createdAt - a.createdAt);

      newsArray.forEach(news => {
        let commentsHTML = '';
        if (news.comments && news.comments.length > 0) {
          commentsHTML = news.comments.map(c => `
            <div class="comment">
              <span class="comment-author">${c.author}</span>
              ${c.text}
            </div>
          `).join('');
        }

        const parsedText = parseMarkdown(news.text);
        const deleteBtnHTML = currentRole === 'admin'
          ? `<button class="delete-btn" onclick="deleteNews('${news.id}')" title="Удалить новость">🗑</button>`
          : '';
        const authorBadge = news.author ? `<span style="font-size: 0.75rem; background: rgba(255,59,59,0.1); padding: 2px 6px; border-radius: 4px; margin-left: 8px;">${news.author}</span>` : '';

        const card = document.createElement('div');
        card.className = 'news-card';
        card.innerHTML = `
          ${deleteBtnHTML}
          <div class="date">${news.date} ${authorBadge}</div>
          <h2>${news.title}</h2>
          <div class="news-content">${parsedText}</div>

          <div class="comments-section">
            <h4 style="font-size: 0.9rem; margin-bottom: 10px; color: var(--muted);">Комментарии (${news.comments ? news.comments.length : 0}):</h4>
            <div>${commentsHTML}</div>

            <div class="comment-form">
              <input type="text" id="name_${news.id}" class="comment-input name-input" placeholder="Твоё имя...">
              <input type="text" id="text_${news.id}" class="comment-input text-input" placeholder="Комментарий...">
              <button class="btn" onclick="addComment('${news.id}')" style="padding: 8px 15px;">➤</button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    const q = query(newsCollection);
    onSnapshot(q, (snapshot) => {
      renderNewsList(snapshot);
    });

    updateAuthUI();
