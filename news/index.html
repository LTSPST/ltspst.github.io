<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Новости — LTSPST</title>
  <style>
    :root {
      --bg: #120608; --card: #1e0b0e; --border: rgba(255, 80, 80, 0.14);
      --text: #f9f1f1; --muted: #c9a5a5; --accent1: #ff3b3b; --accent2: #ff6b4a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(ellipse at 50% 0%, rgba(255, 59, 59, 0.12), transparent 55%), var(--bg);
      color: var(--text); line-height: 1.6; min-height: 100vh;
    }
    .header {
      background: rgba(18, 6, 8, 0.85); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border); padding: 16px 24px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    .header a { color: var(--muted); text-decoration: none; font-weight: 600; transition: color 0.2s; }
    .header a:hover { color: var(--text); }
    .logo { font-weight: 900; font-size: 1.2rem; color: var(--text) !important; display: flex; align-items: center; gap: 10px;}
    .logo img { width: 32px; height: 32px; border-radius: 8px; }
    
    .container { max-width: 720px; margin: 0 auto; padding: 40px 18px; }
    h1 { font-size: 2rem; font-weight: 900; margin-bottom: 10px; color: var(--accent1); }
    .subtitle { color: var(--muted); margin-bottom: 24px; }

    .auth-box {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 20px; margin-bottom: 24px;
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;
    }
    .auth-input {
      background: rgba(0,0,0,0.3); border: 1px solid var(--border); color: white;
      padding: 10px 14px; border-radius: 8px; outline: none; font-family: inherit;
    }
    .auth-input:focus { border-color: var(--accent1); }
    .btn {
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      color: white; border: none; padding: 10px 20px; border-radius: 8px;
      font-weight: 700; cursor: pointer; transition: transform 0.2s; font-family: inherit;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn-outline { background: transparent; border: 1px solid var(--accent1); color: var(--accent1); }
    .btn-outline:hover { background: rgba(255, 59, 59, 0.1); }
    .user-greet { display: flex; align-items: center; gap: 15px; width: 100%; justify-content: space-between; }

    .news-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 24px; margin-bottom: 16px; transition: transform 0.2s, border-color 0.2s;
    }
    .news-card:hover { border-color: rgba(255, 59, 59, 0.4); }
    .date { font-size: 0.85rem; color: var(--muted); margin-bottom: 8px; font-weight: 600; }
    .news-card h2 { font-size: 1.3rem; margin-bottom: 10px; }
    .news-card p { color: var(--muted); font-size: 0.95rem; margin-bottom: 16px; }
    
    .comments-section { border-top: 1px solid var(--border); padding-top: 16px; margin-top: 16px; }
    .comment { background: rgba(0,0,0,0.2); padding: 12px; border-radius: 10px; margin-bottom: 10px; font-size: 0.9rem; }
    .comment-author { font-weight: bold; color: var(--accent2); margin-bottom: 4px; display: block; }
    .comment-form { display: flex; gap: 10px; margin-top: 10px; }
    .comment-input {
      flex: 1; background: rgba(0,0,0,0.3); border: 1px solid var(--border);
      color: white; padding: 8px 12px; border-radius: 8px; outline: none; font-family: inherit; font-size: 0.9rem;
    }
    .comment-input:focus { border-color: var(--accent1); }

    .add-news-form { display: none; background: var(--card); border: 1px solid var(--accent1); border-radius: 16px; padding: 20px; margin-bottom: 24px; }
    .add-news-form.active { display: block; }
    .add-news-form input, .add-news-form textarea {
      width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border);
      color: white; padding: 10px; border-radius: 8px; margin-bottom: 10px; font-family: inherit; outline: none;
    }
    .add-news-form input:focus, .add-news-form textarea:focus { border-color: var(--accent1); }
    .add-news-form textarea { min-height: 100px; resize: vertical; }
  </style>
</head>
<body>
  <header class="header">
    <a href="../" class="logo"><img src="../logo.png" onerror="this.style.display='none'"> ← LTSPST</a>
    <a href="../">На главную</a>
  </header>

  <div class="container">
    <div style="display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 10px;">
      <div>
        <h1>Новости</h1>
        <p class="subtitle">Последние события проекта</p>
      </div>
      <button id="toggleAddBtn" class="btn" style="display: none;" onclick="toggleAddForm()">+ Добавить новость</button>
    </div>

    <!-- БЛОК АВТОРИЗАЦИИ -->
    <div id="authBox" class="auth-box">
      <div id="loginForm" style="display: flex; gap: 10px; flex-wrap: wrap; width: 100%;">
        <input type="text" id="usernameInput" class="auth-input" placeholder="Твой никнейм" style="flex: 1; min-width: 150px;">
        <button class="btn" onclick="login()">Войти</button>
      </div>
      <div id="loggedInView" class="user-greet" style="display: none;">
        <span>Привет, <b id="currentUser" style="color: var(--accent1);"></b>!</span>
        <button class="btn btn-outline" onclick="logout()">Выйти</button>
      </div>
    </div>

    <!-- ФОРМА ДОБАВЛЕНИЯ НОВОСТИ -->
    <div id="addNewsForm" class="add-news-form">
      <h3 style="margin-bottom: 15px;">Новая запись</h3>
      <input type="text" id="newsTitle" placeholder="Заголовок новости...">
      <textarea id="newsText" placeholder="Текст новости..."></textarea>
      <div style="display: flex; gap: 10px;">
        <button class="btn" onclick="addNews()">Опубликовать</button>
        <button class="btn btn-outline" onclick="toggleAddForm()">Отмена</button>
      </div>
    </div>

    <!-- СПИСОК НОВОСТЕЙ -->
    <div id="newsList"></div>

  </div>

  <script>
    let currentUser = localStorage.getItem('ltspst_user') || null;

    function updateAuthUI() {
      const loginForm = document.getElementById('loginForm');
      const loggedInView = document.getElementById('loggedInView');
      const toggleAddBtn = document.getElementById('toggleAddBtn');
      const currentUserSpan = document.getElementById('currentUser');

      if (currentUser) {
        loginForm.style.display = 'none';
        loggedInView.style.display = 'flex';
        currentUserSpan.textContent = currentUser;
        toggleAddBtn.style.display = 'block';
      } else {
        loginForm.style.display = 'flex';
        loggedInView.style.display = 'none';
        toggleAddBtn.style.display = 'none';
        document.getElementById('addNewsForm').classList.remove('active');
      }
    }

    function login() {
      const input = document.getElementById('usernameInput').value.trim();
      if (input.length < 2) return alert('Введи никнейм (мин. 2 символа)');
      currentUser = input;
      localStorage.setItem('ltspst_user', currentUser);
      document.getElementById('usernameInput').value = '';
      updateAuthUI();
    }

    function logout() {
      currentUser = null;
      localStorage.removeItem('ltspst_user');
      updateAuthUI();
    }

    let newsData = JSON.parse(localStorage.getItem('ltspst_news')) || [
      {
        id: 1,
        date: '21 Ноября 2026',
        title: 'Запуск официального сайта!',
        text: 'Мы запустили обновленный сайт. Теперь все проекты и соцсети в одном месте. Спасибо, что вы с нами!',
        comments: []
      }
    ];

    function saveNews() {
      localStorage.setItem('ltspst_news', JSON.stringify(newsData));
      renderNews();
    }

    function toggleAddForm() {
      const form = document.getElementById('addNewsForm');
      form.classList.toggle('active');
    }

    function addNews() {
      const title = document.getElementById('newsTitle').value.trim();
      const text = document.getElementById('newsText').value.trim();
      
      if (!title || !text) return alert('Заполни заголовок и текст!');

      const newNews = {
        id: Date.now(),
        date: new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' }),
        title: title,
        text: text,
        comments: []
      };

      newsData.unshift(newNews);
      document.getElementById('newsTitle').value = '';
      document.getElementById('newsText').value = '';
      toggleAddForm();
      saveNews();
    }

    function addComment(newsId) {
      if (!currentUser) return alert('Войди, чтобы оставить комментарий!');
      
      const input = document.getElementById('commentInput_' + newsId);
      const text = input.value.trim();
      if (!text) return;

      const newsItem = newsData.find(n => n.id === newsId);
      if (newsItem) {
        newsItem.comments.push({ author: currentUser, text: text });
        input.value = '';
        saveNews();
      }
    }

    function renderNews() {
      const container = document.getElementById('newsList');
      container.innerHTML = '';

      if (newsData.length === 0) {
        container.innerHTML = '<p style="color: var(--muted);">Пока новостей нет.</p>';
        return;
      }

      newsData.forEach(news => {
        let commentsHTML = '';
        if (news.comments && news.comments.length > 0) {
          commentsHTML = news.comments.map(c => `
            <div class="comment">
              <span class="comment-author">${c.author}</span>
              ${c.text}
            </div>
          `).join('');
        }

        const commentFormHTML = currentUser ? `
          <div class="comment-form">
            <input type="text" id="commentInput_${news.id}" class="comment-input" placeholder="Написать комментарий...">
            <button class="btn" onclick="addComment(${news.id})" style="padding: 8px 15px;">➤</button>
          </div>
        ` : `<p style="font-size: 0.85rem; color: var(--muted); margin-top: 10px;">Войдите, чтобы оставить комментарий.</p>`;

        const card = document.createElement('div');
        card.className = 'news-card';
        card.innerHTML = `
          <div class="date">${news.date}</div>
          <h2>${news.title}</h2>
          <p>${news.text}</p>
          
          <div class="comments-section">
            <h4 style="font-size: 0.9rem; margin-bottom: 10px; color: var(--muted);">Комментарии (${news.comments ? news.comments.length : 0}):</h4>
            <div id="commentsList_${news.id}">${commentsHTML}</div>
            ${commentFormHTML}
          </div>
        `;
        container.appendChild(card);
      });
    }

    updateAuthUI();
    renderNews();
  </script>
</body>
</html>
